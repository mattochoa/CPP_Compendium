# CPP Compendium: archetype specifications (machine-readable half of Framework.md)
# sections   H2 headings that must exist (order is the recommended order)
# min_words  prose words excluding code/frontmatter
# diagrams   minimum count of ```mermaid blocks + ```text diagram blocks (box-drawing art)
# tables     minimum markdown tables
# code       minimum ```cpp blocks
# quiz       minimum "> [!quiz]-" items
# template   file in 00 System/Templates used by `cc.py new`

concept:
  template: T-Concept.md
  sections: [The Problem, Mental Model, Mechanics, Under the Hood, In Code, Pitfalls, Evolution, Connections, Check Yourself, Sources]
  min_words: 1100
  diagrams: 1
  tables: 1
  code: 2
  quiz: 3

