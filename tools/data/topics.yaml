# CPP Compendium: topic registry (the Atlas backlog)
#
# One line per planned note. The registry is the source of truth for what the
# Compendium intends to contain; a note's frontmatter is the source of truth
# for its *status*.
#
# Fields
#   id    stable kebab-case key (never rename; it is the note's `id` property)
#   t     title = file name (no  : / \ ? * < > | "  characters)
#   ty    archetype: map | concept | mechanism | idiom | pitfall | comparison | evolution | guide | path
#   d     domain code (see domains.yaml)
#   tier  depth: 1 foundational, 2 working proficiency, 3 advanced, 4 expert
#   w     wave: 0 frame (maps), 1 spine, 2 proficiency, 3 advanced, 4 specialist
#   pre   prerequisite topic ids (shape the learning graph and the selection order)
#   kw    extra search keywords for `cc.py src suggest`
#   pr    CPP Project Continuum project numbers that exercise this topic
#   al    aliases (Obsidian aliases; may contain :: and <>)
#
# Growth rule: the Builder MAY append topics discovered while writing (use
# `cc.py registry add`). The Editor curates: merges, splits, re-waves.

